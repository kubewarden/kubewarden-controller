suite: certificates generation
templates:
  - controller/webhooks.yaml
release:
  namespace: "kubewarden"
tests:
  - it: "should generate a CA certificate and store it in the kubewarden-ca secret"
    documentSelector:
      path: metadata.name
      value: kubewarden-ca
    asserts:
      - isNotNullOrEmpty:
          path: data["ca.crt"]
      - isNotNullOrEmpty:
          path: data["ca.key"]
      - notExists:
          path: data["old-ca.crt"]
  - it: "should generate a leaf certificate and store it in the kubewarden-webhook-server-cert secret"
    documentSelector:
      path: metadata.name
      value: kubewarden-webhook-server-cert
    asserts:
      - isNotNullOrEmpty:
          path: data["tls.crt"]
      - isNotNullOrEmpty:
          path: data["tls.key"]
  - it: "should generate a leaf certificate and store it in the kubewarden-audit-scanner-client-cert secret"
    documentSelector:
      path: metadata.name
      value: kubewarden-audit-scanner-client-cert
    asserts:
      - isNotNullOrEmpty:
          path: data["tls.crt"]
      - isNotNullOrEmpty:
          path: data["tls.key"]
  - it: "should inject the caBundle into the webhook configurations"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    asserts:
      - isNotNullOrEmpty:
          path: webhooks[*].clientConfig.caBundle
  - it: "should mark the webhook configurations for the CA bundle injection of the controller"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    asserts:
      - equal:
          path: metadata.annotations["kubewarden.io/inject-ca-from"]
          value: kubewarden/kubewarden-ca
  - it: "should keep the CA bundle injection annotation next to additionalAnnotations"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    set:
      additionalAnnotations:
        team: platform
        kubewarden.io/inject-ca-from: other/secret
    asserts:
      - equal:
          path: metadata.annotations["kubewarden.io/inject-ca-from"]
          value: kubewarden/kubewarden-ca
      - equal:
          path: metadata.annotations.team
          value: platform
